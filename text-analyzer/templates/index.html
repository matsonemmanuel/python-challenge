<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Text Analyzer</h1>
        <form method="POST">
            <textarea name="text" rows="10" cols="50" placeholder="Enter your text here..."></textarea><br>
            <button type="submit">Analyze</button>
        </form>

        {% if result %}
        <div class="results">
            <p><strong>Word Count:</strong> {{ result.word_count }}</p>
            <p><strong>Character Count:</strong> {{ result.char_count }}</p>
            <p><strong>Most Frequent Word:</strong> {{ result.most_freq_word }}</p>
            <p><strong>Lexical Density:</strong> {{ result.lexical_density }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
